global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:3000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]

  # nginx: add nginx-prometheus-exporter sidecar in production
