# CUSTOM_OS OTA — production stack (Docker Compose, self-hosted MinIO)
# Usage: cp .env.example .env && npm run generate-env && docker compose up -d

name: custom-os-ota

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://ota:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ota
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in infra/docker/.env}
  CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET in infra/docker/.env}
  ROLLOUT_HASH_SECRET: ${ROLLOUT_HASH_SECRET:?set ROLLOUT_HASH_SECRET in infra/docker/.env}
  OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:-https://release.mod-syria.org/}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://release.mod-syria.org/s3}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_BUCKET_QUARANTINE: ota-quarantine
  S3_BUCKET_PUBLISHED: ota-published
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  OTA_MAX_PACKAGE_BYTES: ${OTA_MAX_PACKAGE_BYTES:-8589934592}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ota-locations.conf:/etc/nginx/ota-locations.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment after certbot (see docs/deployment.md):
      # - ../nginx/nginx.ssl-server.conf:/etc/nginx/conf.d/ssl-server.conf:ro
      # - ${SSL_CERT_DIR:-/etc/letsencrypt/live/release.mod-syria.org}:/etc/nginx/ssl:ro
    depends_on:
      dashboard:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1G

  dashboard:
    image: ${DASHBOARD_IMAGE:-custom-os-ota/dashboard:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
    environment:
      <<: *app-env
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      replicas: ${DASHBOARD_REPLICAS:-1}
      resources:
        limits:
          cpus: "2"
          memory: 1G

  worker:
    image: ${WORKER_IMAGE:-custom-os-ota/worker:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "4"
          memory: 4G

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ota
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota -d ota"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    # Pinned by digest (pull with: docker pull minio/minio@sha256:...)
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Browser presigned uploads (same origin via nginx /s3/); global CORS for community MinIO
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-https://release.mod-syria.org,http://localhost:3000}
      MINIO_API_REQUESTS_MAX: ${MINIO_API_REQUESTS_MAX:-10000}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Waiting for MinIO at $${MINIO_HOST}..."
        until mc alias set local "http://$${MINIO_HOST}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" 2>/dev/null; do
          sleep 2
        done
        mc mb --ignore-existing "local/ota-quarantine"
        mc mb --ignore-existing "local/ota-published"
        mc anonymous set download "local/ota-published"
        echo "MinIO buckets ready."
    environment:
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
