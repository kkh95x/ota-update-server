# CUSTOM_OS OTA — reference nginx configuration
# OTA zips: NO compression. Large downloads: long timeouts, no buffering.
#
# Default: HTTP on port 80 (works without TLS certificates).
# HTTPS: mount nginx.ssl-server.conf + Let's Encrypt certs (see docs/deployment.md).

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    send_timeout      86400s;

    proxy_read_timeout    86400s;
    proxy_send_timeout    86400s;
    client_body_timeout   86400s;

    # Default: allow multi-GB OTA uploads on /s3/; admin JSON limits are per-location below.
    client_max_body_size 0;
    limit_req_zone $binary_remote_addr zone=ota_metadata:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=ota_download:10m;

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remoteAddr":"$remote_addr",'
        '"xForwardedFor":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"requestTime":$request_time,'
        '"userAgent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    upstream dashboard {
        least_conn;
        server dashboard:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream minio_s3 {
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Browser presigned PUT to /s3/ (cross-origin when page scheme differs from S3_PUBLIC_ENDPOINT)
    map $http_origin $s3_cors_origin {
        default "";
        "~^https://release\.mod-syria\.org$" $http_origin;
        "~^http://release\.mod-syria\.org$" $http_origin;
        "~^http://localhost(:[0-9]+)?$" $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    server {
        listen 80 default_server;
        server_name release.mod-syria.org localhost 127.0.0.1;

        include /etc/nginx/ota-locations.conf;
    }

    # Optional TLS — enable by mounting conf.d/ssl-server.conf (see nginx.ssl-server.conf)
    include /etc/nginx/conf.d/*.conf;
}
