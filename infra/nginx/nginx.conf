# CUSTOM_OS OTA — reference nginx configuration
# OTA zips: NO compression. Large downloads: long timeouts, no buffering.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    send_timeout      86400s;

    # Large OTA downloads may run for hours (Range resume)
    proxy_read_timeout    86400s;
    proxy_send_timeout    86400s;
    client_body_timeout   86400s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=ota_metadata:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=ota_download:10m;

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remoteAddr":"$remote_addr",'
        '"xForwardedFor":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"requestTime":$request_time,'
        '"userAgent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    upstream dashboard {
        least_conn;
        server dashboard:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream minio_s3 {
        server minio:9000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name release.mod-syria.org;

        ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_certificate / ssl_certificate_key — mount via secrets

        # Admin JSON only — OTA uploads use presigned multipart direct to /s3/
        client_max_body_size 10m;

        # --- MinIO S3 API (presigned uploads + large GET) ---
        location /s3/ {
            rewrite ^/s3/(.*)$ /$1 break;

            proxy_pass http://minio_s3;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            gzip off;

            client_max_body_size 0;
            limit_conn ota_download 50;

            add_header X-Content-Type-Options nosniff always;
        }

        # --- OTA metadata (tiny text files) ---
        # Includes standard channels and group channels (grp-*)
        location ~ ^/[a-z0-9]+-(stable|beta|alpha|testing|stable-security-preview|grp-[a-z0-9-]+)$ {
            limit_req zone=ota_metadata burst=120 nodelay;

            proxy_pass http://minio_s3/ota-published$uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            gzip off;

            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header X-Content-Type-Options nosniff;
        }

        # --- OTA packages (multi-GB, immutable, NO gzip, Range) ---
        location ~ ^/[a-z0-9]+-(ota_update|incremental)- {
            limit_conn ota_download 50;

            proxy_pass http://minio_s3/ota-published$uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            gzip off;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Accept-Ranges bytes;
        }

        location ~ \.zip$ {
            limit_conn ota_download 50;

            proxy_pass http://minio_s3/ota-published$uri;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;

            gzip off;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Accept-Ranges bytes;
        }

        # --- Admin dashboard (compression OK) ---
        location /admin {
            limit_req zone=admin_login burst=10 nodelay;

            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
            proxy_set_header Connection "";

            gzip on;
            gzip_types text/plain text/css application/json application/javascript;
            gzip_min_length 256;

            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy strict-origin-when-cross-origin;
        }

        location /_next/ {
            proxy_pass http://dashboard;
            gzip on;
            gzip_types text/css application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /health/ {
            proxy_pass http://dashboard;
            access_log off;
        }
    }
}
