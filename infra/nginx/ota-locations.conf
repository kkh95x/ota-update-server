# Included by HTTP (port 80) and optional HTTPS (port 443) server blocks.

# --- MinIO S3 API (presigned uploads + large GET) ---
location /s3/ {
    rewrite ^/s3/(.*)$ /$1 break;

    proxy_pass http://minio_s3;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    gzip off;

    client_max_body_size 0;
    limit_conn ota_download 50;

    add_header X-Content-Type-Options nosniff always;
}

# --- OTA metadata (tiny text files) ---
location ~ ^/[a-z0-9]+-(stable|beta|alpha|testing|stable-security-preview|grp-[a-z0-9-]+)$ {
    limit_req zone=ota_metadata burst=120 nodelay;

    proxy_pass http://minio_s3/ota-published$uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    gzip off;

    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header X-Content-Type-Options nosniff;
}

# --- OTA packages (multi-GB, immutable, NO gzip, Range) ---
location ~ ^/[a-z0-9]+-(ota_update|incremental)- {
    limit_conn ota_download 50;

    proxy_pass http://minio_s3/ota-published$uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    gzip off;

    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    add_header Accept-Ranges bytes;
}

location ~ \.zip$ {
    limit_conn ota_download 50;

    proxy_pass http://minio_s3/ota-published$uri;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;

    gzip off;

    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Accept-Ranges bytes;
}

# --- Dashboard API (login, admin JSON) ---
location = /api/auth/login {
    limit_req zone=admin_login burst=5 nodelay;

    proxy_pass http://dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_set_header Connection "";

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
}

location /api/ {
    proxy_pass http://dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_set_header Connection "";

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
}

# --- Admin dashboard UI ---
location /admin {
    proxy_pass http://dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_set_header Connection "";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

location /_next/ {
    proxy_pass http://dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip on;
    gzip_types text/css application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /health/ {
    proxy_pass http://dashboard;
    access_log off;
}

location = / {
    return 302 /admin/login;
}
