# HTTPS with certs copied to a single host folder (fullchain.pem + privkey.pem).

server {
    listen 443 ssl;
    http2 on;
    server_name release.mod-syria.org localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/ota-locations.conf;
}
