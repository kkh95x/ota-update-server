# HTTPS server — requires Let's Encrypt on the VPS host.
# Mount the full /etc/letsencrypt tree (live/*.pem are symlinks into archive/).
#
# docker-compose volumes:
#   - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
#   - ../nginx/nginx.ssl-server.conf:/etc/nginx/conf.d/ssl-server.conf:ro

server {
    listen 443 ssl;
    http2 on;
    server_name release.mod-syria.org localhost 127.0.0.1;

    ssl_certificate     /etc/letsencrypt/live/release.mod-syria.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.mod-syria.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/ota-locations.conf;
}
