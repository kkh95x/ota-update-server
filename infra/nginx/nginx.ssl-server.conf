# Mount as /etc/nginx/conf.d/ssl-server.conf and certs at /etc/nginx/ssl/
# Example docker-compose volume:
#   - ../nginx/nginx.ssl-server.conf:/etc/nginx/conf.d/ssl-server.conf:ro
#   - /etc/letsencrypt/live/release.mod-syria.org:/etc/nginx/ssl:ro

server {
    listen 443 ssl http2;
    server_name release.mod-syria.org localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    include /etc/nginx/ota-locations.conf;
}
