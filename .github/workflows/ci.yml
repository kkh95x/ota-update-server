name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ota:ota@localhost:5432/ota

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ota:ota@localhost:5432/ota
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-auth-secret-minimum-32-characters-long
          CSRF_SECRET: ci-csrf-secret-minimum-32-characters-long
          OTA_PUBLIC_BASE_URL: https://release.mod-syria.org/
          S3_ENDPOINT: http://localhost:9000
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          ROLLOUT_HASH_SECRET: ci-rollout-secret-minimum-32-characters
